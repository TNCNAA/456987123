<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상 참고 사진 대장</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            padding: 20px;
        }

        .gallery-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            color: #0284c7;
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 사진 바둑판 정렬 (그리드) */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .image-card {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .image-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .image-card img {
            width: 100%;
            height: 180px;
            object-fit: contain; /* 미리보기에서도 사진 전체가 쏙 들어오도록 설정 */
            background-color: #ffffff;
            display: block;
            border-bottom: 1px solid #e2e8f0;
        }

        .image-caption {
            padding: 10px;
            font-size: 0.9rem;
            color: #0f172a;
            font-weight: bold;
            background: #ffffff;
        }

        /* ----------------------------------- */
        /* 🖼️ 사진 클릭 시 뜨는 팝업(모달) 스타일 */
        /* ----------------------------------- */
        .modal {
            display: none; /* 기본적으로 숨김 */
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* 어두운 배경 */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .modal-content {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            object-fit: contain; /* 원본 비율 유지 (절대 안 잘림) */
            background-color: white;
        }

        .modal-caption {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 12px;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .close-btn:hover {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <h2>🖼️ 임상 참고 사진 대장</h2>
        
        <div class="image-grid">
            
            <!-- 사진 카드 1 (클릭하면 openModal 함수 실행) -->
            <div class="image-card" onclick="openModal(this)">
                <img src="https://postfiles.pstatic.net/MjAyNjAzMTBfMTgg/MDAxNzczMTA4Mzg5ODk3.xzSHYGAYoz9eB5tKSqKsASD05oMdFVYDcT_gRXeqPD8g.bNfAQDUFCawuQsJVzDEuV_CnsHurKWwX7VEMxKv61y0g.JPEG/output%EF%BC%BF29890022.jpg?type=w966" alt="환부 상태 기록 1">
                <div class="image-caption">환부 상태 기록 1</div>
            </div>

            <!-- 사진 카드 2 -->
            <div class="image-card" onclick="openModal(this)">
                <img src="photo2.jpg" alt="검사 결과지 참고">
                <div class="image-caption">검사 결과지 참고</div>
            </div>

            <!-- 사진 카드 3 -->
            <div class="image-card" onclick="openModal(this)">
                <img src="photo3.jpg" alt="드레싱 관련 참고">
                <div class="image-caption">드레싱 관련 참고</div>
            </div>

        </div>
    </div>

    <!-- 팝업창 (모달) 영역 -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <script>
        // 팝업 열기 함수
        function openModal(cardElement) {
            const img = cardElement.querySelector('img');
            const caption = cardElement.querySelector('.image-caption').innerText;

            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');

            modal.style.display = "flex";
            modalImg.src = img.src;
            modalCaption.innerText = caption;
        }

        // 팝업 닫기 함수
        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }

        // 키보드 ESC 키를 누르면 팝업 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") {
                closeModal();
            }
        });
    </script>

</body>
</html>
