<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>파일 저장소 (무료 Firestore 버전)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        .container { width: 100%; max-width: 600px; background: #ffffff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; }
        .header { background: #0253c7; color: #ffffff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 16px; display: flex; align-items: center; gap: 6px; }
        .header a { color: #ffffff; text-decoration: none; font-size: 18px; }
        .upload-section { padding: 16px; border-bottom: 1px solid #edf2f7; }
        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 24px 12px; text-align: center; background: #f8fafc; cursor: pointer; transition: 0.2s; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #0253c7; background: #eff6ff; }
        .drop-zone-icon { font-size: 32px; margin-bottom: 6px; color: #0253c7; pointer-events: none; }
        .drop-zone-text { font-size: 13px; color: #475569; font-weight: 500; pointer-events: none; }
        .file-list-section { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .file-list-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: #1e293b; margin-bottom: 4px; }
        .file-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .file-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .file-name { font-size: 13px; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta { font-size: 11px; color: #94a3b8; }
        .file-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .btn-download { background: #0253c7; color: #ffffff; border: none; padding: 6px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 6px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📦 파일 저장소 (무료)</h1>
        <a href="index.html" title="홈으로">🏠</a>
    </div>

    <div class="upload-section">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="drop-zone-icon">📁</div>
            <div class="drop-zone-text">클릭하거나 파일을 여기로 끌어다 놓으세요 (최대 750KB)</div>
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
        </div>
    </div>

    <div class="file-list-section">
        <div class="file-list-header">
            <span>등록된 파일 목록</span>
            <span id="fileCount" style="color: #0253c7;">0개</span>
        </div>
        <div id="fileListContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHe6Ibe8WBzceMnWJxmQrKJQw10Jmmkmg",
        authDomain: "tncnaaa.firebaseapp.com",
        projectId: "tncnaaa",
        storageBucket: "tncnaaa.firebasestorage.app",
        messagingSenderId: "822557545187",
        appId: "1:822557545187:web:e18ac197649be1164b6bd6"
    };

    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    } catch(e) {
        console.error("Firebase 초기화 오류:", e);
    }

    document.addEventListener('DOMContentLoaded', () => {
        setupDragAndDrop();
        loadFiles();
    });

    // 드래그 앤 드롭(끌어오기) 이벤트 리스너 등록
    function setupDragAndDrop() {
        const dropZone = document.getElementById('dropZone');

        // 브라우저 기본 드래그 동작(파일 바로 열기 등) 방지
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, preventDefaults, false);
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        // 박스 위로 올렸을 때 하이라이트 스타일 적용
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        // 벗어나거나 드롭했을 때 스타일 해제
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        // 파일 드롭 시 처리
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) {
                processFile(files[0]);
            }
        });
    }

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    // 파일 선택(클릭) 시 처리
    function handleFileSelect(e) {
        const file = e.target.files && e.target.files[0];
        if (file) {
            processFile(file);
        }
    }

    // 공통 파일 업로드/저장 함수
    function processFile(file) {
        if (!file) return;

        // Firestore 1MB 제한 대비 750KB 이하 권장
        if (file.size > 750 * 1024) {
            alert("Firestore 무료 저장 한도로 인해 750KB 이하 파일만 업로드할 수 있습니다.");
            document.getElementById('fileInput').value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
            const base64Data = event.target.result;
            const fileData = {
                name: file.name,
                type: file.type || 'application/octet-stream',
                size: (file.size / 1024).toFixed(1) + ' KB',
                data: base64Data,
                uploadedAt: new Date().toLocaleDateString()
            };

            if (db) {
                db.collection("free_uploaded_files").add(fileData).then(() => {
                    document.getElementById('fileInput').value = '';
                    loadFiles();
                }).catch(err => {
                    console.error("저장 실패:", err);
                    alert("파일 저장에 실패했습니다.");
                });
            }
        };
        reader.readAsDataURL(file);
    }

    function loadFiles() {
        if (!db) return;

        db.collection("free_uploaded_files").get().then((snapshot) => {
            const listContainer = document.getElementById('fileListContainer');
            const fileCount = document.getElementById('fileCount');
            listContainer.innerHTML = '';

            let docs = [];
            snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
            fileCount.innerText = docs.length + '개';

            if (docs.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; padding:24px; color:#94a3b8; font-size:13px;">등록된 파일이 없습니다.</div>`;
                return;
            }

            docs.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <span class="file-name" title="${file.name}">📄 ${file.name}</span>
                        <span class="file-meta">${file.size} · ${file.uploadedAt}</span>
                    </div>
                    <div class="file-actions">
                        <a class="btn-download" href="${file.data}" download="${file.name}">다운로드</a>
                        <button class="btn-delete" onclick="deleteFile('${file.id}')">삭제</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        });
    }

    function deleteFile(docId) {
        if (!confirm("파일을 삭제하시겠습니까?")) return;
        db.collection("free_uploaded_files").doc(docId).delete().then(loadFiles);
    }
</script>

</body>
</html>
