<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 외부 블로그 이미지 403 차단 방지 -->
    <meta name="referrer" content="no-referrer">
    <title>MEMOY</title>
    <!-- Firebase SDK 로드 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #eef2f5; display: flex; justify-content: center; align-items: center; touch-action: manipulation;
        }

        .app-container {
            width: 100%; max-width: 100%; height: 100%; height: 100dvh;
            background-color: #ffffff; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        @media (min-width: 768px) {
            .app-container { max-width: 760px; border-radius: 16px; height: 95vh; max-height: 880px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        }

        .screen { display: none; flex-direction: column; height: 100%; width: 100%; overflow: hidden; }
        .screen.active { display: flex; }

        .category-bar {
            display: flex; gap: 16px; padding: 14px 16px; border-bottom: 1px solid #eee;
            overflow-x: auto; white-space: nowrap; background: #fff; flex-shrink: 0; -webkit-overflow-scrolling: touch;
        }
        .category-tab { font-size: 14px; color: #666; cursor: pointer; padding-bottom: 4px; user-select: none; }
        .category-tab.active { color: #0253c7; font-weight: bold; border-bottom: 2px solid #0253c7; }

        .list-area { flex: 1; padding: 12px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .post-card-list { display: flex; flex-direction: column; }
        .post-card-item { padding: 10px 4px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .post-card-item:hover { background-color: #f8fafc; }
        .post-card-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .post-card-cat { color: #0253c7; font-weight: bold; }
        .post-card-date { color: #888; font-size: 11px; }
        .post-card-title { font-size: 14px; color: #1e293b; font-weight: 500; word-break: break-all; line-height: 1.4; }

        /* 메모장 스타일 */
        .memo-app-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .memo-app-container { background: transparent; border: none; padding: 0; width: 100%; height: 100%; display: flex; flex-direction: column; gap: 10px; }
        .memo-top-bar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .memo-add-btn { width: 38px; height: 38px; border-radius: 50%; background: #0f172a; color: white; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .memo-search-input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; background: #f8fafc; outline: none; }
        .memo-main-layout { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
        @media (min-width: 768px) { .memo-main-layout { display: grid; grid-template-columns: 260px 1fr; gap: 12px; } }
        .memo-list-pane { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 180px; overflow-y: auto; flex-shrink: 0; }
        @media (min-width: 768px) { .memo-list-pane { max-height: none; grid-template-columns: 1fr; } }
        .memo-card-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(0,0,0,0.05); height: 48px; display: flex; align-items: center; }
        .memo-card-item.active { border: 2px solid #0f172a; }
        .memo-card-title { font-size: 0.9rem; font-weight: bold; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .memo-editor-pane { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow: hidden; }
        .memo-edit-title { font-size: 1rem; font-weight: bold; border: none; background: transparent; border-bottom: 2px solid #cbd5e1; padding-bottom: 4px; outline: none; color: #0f172a; }
        .memo-color-picker-row { display: flex; gap: 6px; align-items: center; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .memo-edit-content { flex: 1; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-size: 0.9rem; outline: none; overflow-y: auto; white-space: pre-wrap; }
        .memo-pane-btns { display: flex; justify-content: space-between; align-items: center; }

        .list-footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid #eee; background: #fff; flex-shrink: 0; gap: 6px; }
        .search-input { flex: 1; min-width: 0; border: 1px solid #ddd; border-radius: 20px; padding: 6px 12px; font-size: 13px; outline: none; }
        .btn-link-collector { background: #eff6ff; color: #0253c7; border: 1px solid #bfdbfe; padding: 7px 11px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-write { background: #0253c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }

        /* 에디터 화면 */
        #editorScreen { height: 100%; overflow: hidden; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; gap: 8px; background: #fff; }
        .editor-header select { padding: 4px 6px; border-radius: 6px; border: 1px solid #ddd; outline: none; font-size: 13px; }
        .editor-body { flex: 1; padding: 16px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .title-input { font-size: 18px; font-weight: bold; border: none; outline: none; border-bottom: 1px solid #eee; padding-bottom: 8px; width: 100%; }
        .content-box { flex: 1; outline: none; font-size: 15px; line-height: 1.6; min-height: 250px; width: 100%; word-break: break-all; }
        
        /* 📷 본문 안에서의 사진 썸네일 크기 제한 스타일 (작게 표시) */
        .content-box img, .view-content img {
            max-width: 120px !important;
            max-height: 120px !important;
            width: auto !important;
            height: auto !important;
            object-fit: cover !important;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            margin: 4px 6px 4px 0;
            cursor: pointer;
            display: inline-block;
            vertical-align: middle;
        }
        
        .view-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; background: #fff; }
        .view-body { flex: 1; padding: 16px; overflow-y: auto; overflow-x: hidden; }
        .view-meta { color: #888; font-size: 13px; margin: 6px 0 14px 0; }
        .btn-group { display: flex; gap: 6px; }
        .btn-edit { background: #35baf6; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-delete { background: #ff5252; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }

        .links-screen-body { flex: 1; padding: 12px; overflow-y: auto; }
        .photo-gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 500px) { .photo-gallery-grid { grid-template-columns: repeat(3, 1fr); } }
        .gallery-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .gallery-thumb-wrap { width: 100%; height: 120px; background: #f1f5f9; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .gallery-thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-info { padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
        .gallery-title { font-size: 12px; font-weight: bold; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gallery-meta { font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; }

        /* URL 모달 */
        .url-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7); z-index: 99999; justify-content: center; align-items: center; padding: 10px;
        }
        .url-modal-container { background: #ffffff; width: 100%; max-width: 720px; height: 90vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .url-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .url-modal-title { font-size: 13px; font-weight: bold; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
        .url-modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #64748b; font-weight: bold; }
        .url-modal-frame { flex: 1; width: 100%; border: none; background: #fff; }

        /* 🖼️ 이미지 확대 팝업 모달창 (클릭 시 크게 띄우기) */
        .img-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 29, 0.94); z-index: 999999; flex-direction: column; justify-content: space-between; align-items: center; padding: 12px 10px 16px 10px;
        }
        .img-modal-topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 6px; z-index: 10002; }
        .img-modal-counter { color: #cbd5e1; font-size: 14px; font-weight: bold; }
        .img-modal-close { background: none; border: none; color: #ffffff; font-size: 32px; cursor: pointer; }
        .img-modal-viewport { position: relative; flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 4px; }
        .img-modal-viewport img {
            max-width: 100% !important; max-height: calc(100dvh - 140px) !important;
            width: auto !important; height: auto !important; border-radius: 8px; object-fit: contain !important; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .img-modal-strip { width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; overflow-x: auto; padding-top: 8px; }
        .strip-thumb { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; cursor: pointer; opacity: 0.5; }
        .strip-thumb.active { border: 2px solid #38bdf8; opacity: 1; }

        .toolbar-bottom { display: flex; justify-content: space-around; padding: 10px 16px; border-top: 1px solid #eee; background: #fff; }
        .toolbar-bottom button { background: none; border: none; font-size: 18px; cursor: pointer; }
        
        .comment-section { margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px; }
        .comment-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .comment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .comment-item { background: #f8f9fa; padding: 8px 12px; border-radius: 8px; border: 1px solid #eee; font-size: 13px; }
        .comment-write-box { display: flex; flex-direction: column; gap: 6px; background: #f1f3f5; padding: 8px; border-radius: 8px; }
        .comment-input { min-height: 36px; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; outline: none; font-size: 13px; }
        .btn-comment-submit { background: #0253c7; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; align-self: flex-end; }
    </style>
</head>
<body spellcheck="false">

<div class="app-container">
    <!-- 1. 메인 목록 화면 -->
    <div id="listScreen" class="screen active">
        <div class="category-bar" id="categoryBar">
            <span class="category-tab active" onclick="setCategory('전체')">전체</span>
            <span class="category-tab" onclick="setCategory('공지')">공지</span>
            <span class="category-tab" onclick="setCategory('NS')">NS</span>
            <span class="category-tab" onclick="setCategory('OS')">OS</span>
            <span class="category-tab" onclick="setCategory('병동')">병동</span>
            <span class="category-tab" onclick="setCategory('GS')">GS</span>
            <span class="category-tab" onclick="setCategory('NR')">NR</span>
            <span class="category-tab" onclick="setCategory('FM')">FM</span>
            <span class="category-tab" onclick="setCategory('(메모)')">(메모)</span>
            <a href="index.html" style="text-decoration: none;" title="메인으로 가기">🏠</a>
        </div>

        <div class="list-area">
            <div id="memoAppScreenArea" style="display:none;" class="memo-app-wrapper">
                <div class="memo-app-container">
                    <div class="memo-top-bar">
                        <button class="memo-add-btn" onclick="createNewMemo()" title="새 메모 추가">+</button>
                        <input type="text" id="memoSearchInput" class="memo-search-input" placeholder="Search 메모 검색..." oninput="filterMemoCards(this.value)">
                    </div>
                    <div class="memo-main-layout">
                        <div class="memo-list-pane" id="memoListPane"></div>
                        <div class="memo-editor-pane" id="memoEditorPane" style="display: none;">
                            <input type="text" id="memoEditTitle" class="memo-edit-title" placeholder="메모 제목" oninput="updateCurrentMemoField()">
                            <div class="memo-color-picker-row">
                                <span style="font-size: 0.75rem; font-weight: bold; color: #64748b;">카드 색상:</span>
                                <div class="color-dot" style="background: #fed7aa;" onclick="changeMemoColor('#fed7aa', this)"></div>
                                <div class="color-dot" style="background: #bfdbfe;" onclick="changeMemoColor('#bfdbfe', this)"></div>
                                <div class="color-dot" style="background: #bbf7d0;" onclick="changeMemoColor('#bbf7d0', this)"></div>
                                <div class="color-dot" style="background: #fef08a;" onclick="changeMemoColor('#fef08a', this)"></div>
                                <div class="color-dot" style="background: #fbcfe8;" onclick="changeMemoColor('#fbcfe8', this)"></div>
                            </div>
                            <div id="memoEditContent" class="memo-edit-content" contenteditable="true" oninput="updateCurrentMemoField()"></div>
                            <div class="memo-pane-btns">
                                <button class="btn" style="background:#0253c7; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="saveMemoAppToCloud()">💾 저장하기</button>
                                <button class="btn" style="background:#fee2e2; color:#ef4444; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="deleteCurrentMemo()">🗑️ 삭제</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="postCardList" class="post-card-list"></div>
        </div>

        <div class="list-footer" id="mainListFooter">
            <input type="text" class="search-input" id="searchKeyword" placeholder="제목+내용 검색..." onkeyup="searchPosts()">
            <button class="btn-link-collector" onclick="openLinkCollector()" title="전체 사진 모아보기">📷 사진모음</button>
            <button class="btn-write" onclick="openEditor()">글쓰기</button>
        </div>
    </div>

    <!-- 2. 글 작성/수정 에디터 화면 -->
    <div id="editorScreen" class="screen">
        <header class="editor-header">
            <span style="cursor:pointer; color:#666;" onclick="showScreen('listScreen')">취소</span>
            <select id="editCategory">
                <option value="NS">NS</option><option value="OS">OS</option><option value="병동">병동</option>
                <option value="GS">GS</option><option value="NR">NR</option><option value="FM">FM</option>
            </select>
            <button class="btn-write" onclick="savePost()">저장</button>
        </header>

        <main class="editor-body">
            <input type="text" id="editTitle" class="title-input" placeholder="제목을 입력하세요">
            <div id="editContent" class="content-box" contenteditable="true" placeholder="내용을 작성하세요..."><p><br></p></div>
        </main>

        <footer class="toolbar-bottom">
            <button onclick="document.getElementById('imageUploader').click()" title="사진 첨부">📷</button>
            <button onclick="addLink()" title="웹 링크 삽입">🔗</button>
        </footer>
        <input type="file" id="imageUploader" accept="image/*" style="display:none;" onchange="uploadImage(event)">
    </div>

    <!-- 3. 상세 조회 화면 -->
    <div id="viewScreen" class="screen">
        <header class="view-header">
            <span style="cursor:pointer;" onclick="showScreen('listScreen')">← 뒤로가기</span>
            <div class="btn-group">
                <button class="btn-edit" onclick="startEditCurrent()">수정</button>
                <button class="btn-delete" onclick="deleteCurrentPost()">삭제</button>
            </div>
        </header>
        <div class="view-body" id="viewBodyContainer">
            <h2 id="viewTitle"></h2>
            <div class="view-meta" id="viewMeta"></div>
            <hr style="border:0; border-top:1px solid #eee; margin-bottom:15px;">
            <div class="view-content" id="viewContent"></div>

            <div class="comment-section">
                <div class="comment-title">댓글 <span id="commentCount">0</span></div>
                <div class="comment-list" id="commentList"></div>
                <div class="comment-write-box">
                    <div id="commentInput" class="comment-input" contenteditable="true" placeholder="댓글을 입력하세요"></div>
                    <button class="btn-comment-submit" onclick="addComment()">댓글 등록</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 사진 갤러리 모음 화면 -->
    <div id="linkCollectorScreen" class="screen">
        <header class="view-header">
            <span style="cursor:pointer;" onclick="showScreen('listScreen')">← 뒤로가기</span>
            <span style="font-weight:bold; font-size:15px; color:#1e293b;">📷 사진 갤러리 모음</span>
            <span style="width:50px;"></span>
        </header>
        <div class="links-screen-body" id="collectedLinksContainer"></div>
    </div>

    <!-- 5. 갤러리 슬라이더 팝업 모달 (클릭 시 크게 띄우기) -->
    <div id="imgModalOverlay" class="img-modal-overlay" onclick="closeImageModal()">
        <div class="img-modal-topbar" onclick="event.stopPropagation()">
            <div id="imgModalCounter" class="img-modal-counter">1 / 1</div>
            <button class="img-modal-close" onclick="closeImageModal()">✕</button>
        </div>
        <div class="img-modal-viewport" id="imgModalViewport">
            <img id="imgModalTarget" src="" alt="크게보기 사진" referrerpolicy="no-referrer">
        </div>
        <div class="img-modal-strip" id="imgModalStrip" onclick="event.stopPropagation()"></div>
    </div>

    <!-- 6. 웹페이지 URL 모달 -->
    <div id="urlModalOverlay" class="url-modal-overlay" onclick="closeUrlModal()">
        <div class="url-modal-container" onclick="event.stopPropagation()">
            <div class="url-modal-header">
                <span id="urlModalTitle" class="url-modal-title">웹사이트 미리보기</span>
                <button class="url-modal-close" onclick="closeUrlModal()">✕</button>
            </div>
            <iframe id="urlModalFrame" class="url-modal-frame" src="" allowfullscreen></iframe>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHe6Ibe8WBzceMnWJxmQrKJQw10Jmmkmg",
        authDomain: "tncnaaa.firebaseapp.com",
        projectId: "tncnaaa",
        storageBucket: "tncnaaa.firebasestorage.app",
        messagingSenderId: "822557545187",
        appId: "1:822557545187:web:e18ac197649be1164b6bd6"
    };

    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    } catch(e) { console.log(e); }

    let posts = JSON.parse(localStorage.getItem('blog_memo_posts')) || [];
    let currentCategory = '전체';
    let currentViewingId = null;
    let isEditing = false;
    let galleryImages = [];
    let currentGalleryIndex = 0;
    let memoList = [];
    let currentMemoId = null;

    document.addEventListener('DOMContentLoaded', function() {
        renderList();
        loadMemoAppData();

        if (db) {
            db.collection("mini_blog_posts").get().then((querySnapshot) => {
                let cloudPosts = [];
                querySnapshot.forEach((doc) => { cloudPosts.push(doc.data()); });
                if (cloudPosts.length > 0) {
                    posts = cloudPosts;
                    localStorage.setItem('blog_memo_posts', JSON.stringify(posts));
                    renderList();
                }
            }).catch(e => console.log(e));
        }
    });

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if (screenId === 'listScreen') renderList();
    }

    function setCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.category-tab').forEach(tab => tab.classList.toggle('active', tab.innerText === cat));
        renderList();
    }

    function renderList() {
        const memoAppScreenArea = document.getElementById('memoAppScreenArea');
        const postCardList = document.getElementById('postCardList');
        const mainListFooter = document.getElementById('mainListFooter');
        
        postCardList.innerHTML = '';

        if (currentCategory === '(메모)') {
            memoAppScreenArea.style.display = 'flex';
            postCardList.style.display = 'none';
            mainListFooter.style.display = 'none';
            loadMemoAppData();
            return;
        }

        memoAppScreenArea.style.display = 'none';
        postCardList.style.display = 'flex';
        mainListFooter.style.display = 'flex';

        let data = (currentCategory === '전체') ? posts : posts.filter(p => p.category === currentCategory);
        if (data.length === 0) {
            postCardList.innerHTML = `<div style="text-align:center; padding:30px; color:#999; font-size:13px;">작성된 글이 없습니다.</div>`;
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'post-card-item';
            card.onclick = () => openView(item.id);
            card.innerHTML = `
                <div class="post-card-header"><span class="post-card-cat">[${item.category}]</span><span class="post-card-date">${item.date}</span></div>
                <div class="post-card-title">${item.title}</div>
            `;
            postCardList.appendChild(card);
        });
    }

    function openEditor() {
        isEditing = false;
        currentViewingId = null;
        document.getElementById('editTitle').value = '';
        document.getElementById('editContent').innerHTML = '<p><br></p>';
        showScreen('editorScreen');
    }

    function savePost() {
        let title = document.getElementById('editTitle').value.trim();
        const rawContent = document.getElementById('editContent').innerHTML.trim();
        const dateStr = new Date().toLocaleDateString();

        if (isEditing && currentViewingId) {
            const idx = posts.findIndex(p => p.id === currentViewingId);
            if (idx !== -1) {
                posts[idx].title = title || dateStr;
                posts[idx].content = rawContent;
                posts[idx].category = document.getElementById('editCategory').value;
                localStorage.setItem('blog_memo_posts', JSON.stringify(posts));
                if (db) db.collection("mini_blog_posts").doc(String(currentViewingId)).set(posts[idx]).catch(e => console.log(e));
            }
        } else {
            const postObj = {
                id: 'post_' + Date.now(),
                category: document.getElementById('editCategory').value,
                title: title || dateStr,
                content: rawContent,
                date: dateStr,
                comments: []
            };
            posts.unshift(postObj);
            localStorage.setItem('blog_memo_posts', JSON.stringify(posts));
            if (db) db.collection("mini_blog_posts").doc(String(postObj.id)).set(postObj).catch(e => console.log(e));
        }
        showScreen('listScreen');
    }

    function openView(id) {
        currentViewingId = id;
        const post = posts.find(p => p.id === id);
        if (!post) return;
        document.getElementById('viewTitle').innerText = post.title;
        document.getElementById('viewMeta').innerText = `[${post.category}] · ${post.date}`;
        document.getElementById('viewContent').innerHTML = post.content;
        renderComments(post.comments || []);
        showScreen('viewScreen');
    }

    function startEditCurrent() {
        const post = posts.find(p => p.id === currentViewingId);
        if (!post) return;
        isEditing = true;
        document.getElementById('editCategory').value = post.category;
        document.getElementById('editTitle').value = post.title;
        document.getElementById('editContent').innerHTML = post.content || '<p><br></p>';
        showScreen('editorScreen');
    }

    function deleteCurrentPost() {
        if (!confirm("이 글을 삭제하시겠습니까?")) return;
        posts = posts.filter(p => p.id !== currentViewingId);
        localStorage.setItem('blog_memo_posts', JSON.stringify(posts));
        if (db) db.collection("mini_blog_posts").doc(String(currentViewingId)).delete().catch(e => console.log(e));
        showScreen('listScreen');
    }

    // 🔗 URL 및 이미지 클릭 시 팝업 연동
    document.addEventListener('click', function(e) {
        const linkEl = e.target.closest('a');
        if (linkEl && !linkEl.closest('#editorScreen')) {
            const href = linkEl.getAttribute('href');
            if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
                e.preventDefault();
                openUrlModal(href);
                return;
            }
        }
        if (e.target.tagName === 'IMG' && !e.target.closest('#editorScreen') && !e.target.closest('#imgModalOverlay')) {
            openSingleImageModal(e.target.getAttribute('src'));
        }
    });

    function openUrlModal(url) {
        document.getElementById('urlModalTitle').innerText = url;
        document.getElementById('urlModalFrame').src = url;
        document.getElementById('urlModalOverlay').style.display = 'flex';
    }
    function closeUrlModal() { document.getElementById('urlModalOverlay').style.display = 'none'; document.getElementById('urlModalFrame').src = ''; }

    function openSingleImageModal(imgSrc) {
        galleryImages = [{ url: imgSrc, postTitle: '사진 확대' }];
        currentGalleryIndex = 0;
        renderGalleryModal();
        document.getElementById('imgModalOverlay').style.display = 'flex';
    }
    function closeImageModal() { document.getElementById('imgModalOverlay').style.display = 'none'; }

    function renderGalleryModal() {
        const item = galleryImages[currentGalleryIndex];
        if (!item) return;
        document.getElementById('imgModalTarget').src = item.url;
        document.getElementById('imgModalCounter').innerText = `${currentGalleryIndex + 1} / ${galleryImages.length}`;
        document.getElementById('imgModalStrip').innerHTML = galleryImages.map((g, i) => `
            <img class="strip-thumb ${i === currentGalleryIndex ? 'active' : ''}" src="${g.url}" onclick="event.stopPropagation(); currentGalleryIndex=${i}; renderGalleryModal();" referrerpolicy="no-referrer">
        `).join('');
    }

    function openLinkCollector() {
        let links = [];
        posts.forEach(p => {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = p.content || '';
            tempDiv.querySelectorAll('img').forEach(img => {
                links.push({ url: img.getAttribute('src'), postTitle: p.title, category: p.category, date: p.date });
            });
        });
        const container = document.getElementById('collectedLinksContainer');
        if (links.length === 0) { container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8;">등록된 사진이 없습니다.</div>`; }
        else {
            container.innerHTML = `<div class="photo-gallery-grid">` + links.map(item => `
                <div class="gallery-card">
                    <div class="gallery-thumb-wrap" onclick="openSingleImageModal('${item.url}')">
                        <img class="gallery-thumb-img" src="${item.url}" loading="lazy" referrerpolicy="no-referrer">
                    </div>
                    <div class="gallery-info">
                        <span class="gallery-title">${item.postTitle}</span>
                        <div class="gallery-meta"><span>[${item.category}]</span><span>${item.date}</span></div>
                    </div>
                </div>
            `).join('') + `</div>`;
        }
        showScreen('linkCollectorScreen');
    }

    function uploadImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            const img = document.createElement('img');
            img.src = ev.target.result;
            document.getElementById('editContent').appendChild(img);
        };
        reader.readAsDataURL(file);
    }

    function addLink() {
        const url = prompt("연결할 웹사이트 URL 주소를 입력하세요:");
        if (!url) return;
        const a = document.createElement('a');
        a.href = url.startsWith('http') ? url : 'https://' + url;
        a.textContent = url;
        a.style.color = '#0253c7';
        a.style.textDecoration = 'underline';
        document.getElementById('editContent').appendChild(a);
    }

    // 댓글 기능
    function renderComments(comments) {
        const listEl = document.getElementById('commentList');
        document.getElementById('commentCount').innerText = comments.length;
        listEl.innerHTML = comments.map((c, i) => `
            <div class="comment-item">
                <div>${c.text}</div>
                <div style="display:flex; justify-content:space-between; font-size:11px; color:#888; margin-top:4px;">
                    <span>${c.date}</span>
                    <button onclick="deleteComment(${i})" style="background:none; border:none; color:#ff5252; cursor:pointer;">삭제</button>
                </div>
            </div>
        `).join('');
    }

    function addComment() {
        const input = document.getElementById('commentInput');
        const text = input.innerText.trim();
        if (!text) return;
        const post = posts.find(p => p.id === currentViewingId);
        if (!post) return;
        if (!post.comments) post.comments = [];
        post.comments.push({ text: text, date: new Date().toLocaleDateString() });
        input.innerText = '';
        localStorage.setItem('blog_memo_posts', JSON.stringify(posts));
        if (db) db.collection("mini_blog_posts").doc(String(post.id)).update({ comments: post.comments }).catch(e => console.log(e));
        renderComments(post.comments);
    }

    function deleteComment(i) {
        const post = posts.find(p => p.id === currentViewingId);
        if (!post || !post.comments) return;
        post.comments.splice(i, 1);
        localStorage.setItem('blog_memo_posts', JSON.stringify(posts));
        if (db) db.collection("mini_blog_posts").doc(String(post.id)).update({ comments: post.comments }).catch(e => console.log(e));
        renderComments(post.comments);
    }

    // 메모장 앱 로직
    async function loadMemoAppData() {
        let saved = null;
        if (db) {
            try {
                const doc = await db.collection("system_data").doc("memo_app_v5").get();
                if (doc.exists) saved = doc.data().list;
            } catch(e) { console.log(e); }
        }
        if (!saved) {
            const local = localStorage.getItem('hospital_memo_app_v5');
            saved = local ? JSON.parse(local) : [];
        }
        memoList = saved;
        renderMemoList(memoList);
        if (memoList.length > 0 && currentCategory === '(메모)') selectMemoCard(memoList[0].id);
    }

    async function saveMemoAppToCloud() {
        if (currentMemoId) {
            const memo = memoList.find(m => m.id === currentMemoId);
            if (memo) {
                memo.title = document.getElementById('memoEditTitle').value;
                memo.content = document.getElementById('memoEditContent').innerText;
            }
        }
        localStorage.setItem('hospital_memo_app_v5', JSON.stringify(memoList));
        if (db) {
            try { await db.collection("system_data").doc("memo_app_v5").set({ list: memoList }); } catch(e) { console.log(e); }
        }
        renderMemoList(memoList);
    }

    function renderMemoList(list) {
        const pane = document.getElementById('memoListPane');
        if (!pane) return;
        pane.innerHTML = '';
        if (list.length === 0) {
            pane.innerHTML = '<p style="color:#94a3b8; font-size:0.8rem; text-align:center; padding:20px; grid-column: span 2;">등록된 메모가 없습니다.</p>';
            return;
        }
        list.forEach(m => {
            const card = document.createElement('div');
            card.className = `memo-card-item ${m.id === currentMemoId ? 'active' : ''}`;
            card.style.backgroundColor = m.color || '#fef08a';
            card.innerHTML = `<div class="memo-card-title">${m.title || '제목 없음'}</div>`;
            card.onclick = () => selectMemoCard(m.id);
            pane.appendChild(card);
        });
    }

    function selectMemoCard(id) {
        currentMemoId = id;
        const memo = memoList.find(m => m.id === id);
        const editorPane = document.getElementById('memoEditorPane');
        if (!memo) { editorPane.style.display = 'none'; return; }
        editorPane.style.display = 'flex';
        document.getElementById('memoEditTitle').value = memo.title;
        document.getElementById('memoEditContent').innerText = memo.content;
        renderMemoList(memoList);
    }

    function createNewMemo() {
        const newMemo = { id: 'memo_' + Date.now(), title: '', content: '', color: '#fef08a' };
        memoList.unshift(newMemo);
        selectMemoCard(newMemo.id);
        saveMemoAppToCloud();
    }

    function deleteCurrentMemo() {
        if (!currentMemoId) return;
        if (confirm("이 메모를 삭제하시겠습니까?")) {
            memoList = memoList.filter(m => m.id !== currentMemoId);
            currentMemoId = memoList.length > 0 ? memoList[0].id : null;
            saveMemoAppToCloud();
            if (currentMemoId) selectMemoCard(currentMemoId);
            else document.getElementById('memoEditorPane').style.display = 'none';
        }
    }

    function changeMemoColor(hex) {
        if (!currentMemoId) return;
        const memo = memoList.find(m => m.id === currentMemoId);
        if (memo) {
            memo.color = hex;
            renderMemoList(memoList);
            saveMemoAppToCloud();
        }
    }

    function updateCurrentMemoField() {
        if (!currentMemoId) return;
        const memo = memoList.find(m => m.id === currentMemoId);
        if (memo) {
            memo.title = document.getElementById('memoEditTitle').value;
            memo.content = document.getElementById('memoEditContent').innerText;
            renderMemoList(memoList);
        }
    }

    function filterMemoCards(keyword) {
        renderMemoList(memoList.filter(m => m.title.toLowerCase().includes(keyword.toLowerCase()) || m.content.toLowerCase().includes(keyword.toLowerCase())));
    }
</script>

</body>
