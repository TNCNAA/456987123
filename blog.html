<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 블로그 시스템 (오류 수정완료 통합본)</title>
    <!-- Firebase SDK 로드 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg: #0f172a;
            --primary: #38bdf8;
            --primary-dark: #0369a1;
            --border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text-main); padding: 10px; }

        .blog-container { max-width: 1550px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

        /* 상단 카테고리 필터 바 */
        .toolbar-sticky { position: sticky; top: 0; background: var(--bg); z-index: 1000; padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .toolbar-top-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
        
        .cat-btn-group { display: flex; flex-wrap: wrap; gap: 4px; }
        .cat-filter-btn { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; background: #1e293b; font-size: 0.8rem; font-weight: bold; color: var(--text-sub); }
        .cat-filter-btn:hover { background: #334155; color: white; }
        .cat-filter-btn.active { background: var(--primary); color: #0f172a; border-color: var(--primary); }

        .sub-cat-bar { display: none; gap: 4px; padding-top: 4px; border-top: 1px dashed var(--border); flex-wrap: wrap; }
        .sub-filter-btn { padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; background: #1e293b; font-size: 0.75rem; color: var(--text-sub); }
        .sub-filter-btn:hover { background: #334155; color: white; }
        .sub-filter-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #38bdf8; }

        .btn-main { background: #64ea8ad7; color: #0f172a; border: none; padding: 6px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.8rem; text-decoration: none; }
        .btn-main:hover { background: #52c875d7; }

        .write-sticky-header {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 950;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .editor-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: white; padding-top: 8px; position: relative; }
        .tool-btn { background: #334155; color: white; border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .tool-btn:hover { background: #475569; }

        /* 인라인 색상 버튼 */
        .color-dot-btn {
            width: 22px; height: 22px; border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.25);
            cursor: pointer; padding: 0; flex-shrink: 0;
            transition: transform 0.12s, border-color 0.12s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .color-dot-btn:hover { transform: scale(1.3); border-color: white; }

        /* 글쓰기 에디터 영역 */
        .editor-area { width: 100%; min-height: 400px; padding: 15px; border: 1px solid var(--border); border-radius: 6px; background: #f8fafc; color: #191919; outline: none; line-height: 1.6; font-size: 0.95rem; margin-top: 10px; }
        .editor-area * { color: inherit; }
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block;
        }
        .img-preview { max-width: 100%; border-radius: 6px; margin: 8px 0; display: block; }

        .post-list { display: flex; flex-direction: column; gap: 0; }
        .post-card { 
            position: relative; 
            padding: 14px 16px; 
            background: var(--bg); 
            cursor: pointer; 
            border-bottom: 1px solid var(--border); 
            transition: background 0.1s; 
        }
        .post-card:hover { background: #1e293b; }
        .post-card.pinned { background: #1e293b; border-left: 4px solid var(--primary); }

        .post-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .post-category { font-size: 0.72rem; background: #334155; color: var(--primary); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .post-footer { display: flex; justify-content: flex-end; margin-top: 8px; }
        .post-date { font-size: 0.75rem; color: var(--text-sub); }

        .post-title { font-size: 1.05rem; font-weight: bold; color: var(--text-main); margin-bottom: 4px; }
        .post-snippet { font-size: 0.85rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .corner-pin {
            position: absolute; top: 0; right: 0; width: 25px; height: 25px;
            display: flex; align-items: center; justify-content: center; font-size: 0.6rem;
            cursor: pointer; opacity: 0.4; transition: opacity 0.2s, transform 0.2s;
        }
        .corner-pin:hover { opacity: 1; transform: scale(1.15); }
        .post-card.pinned .corner-pin { opacity: 1; }

        .post-detail-view { background: var(--bg); padding: 10px 0; }
        .detail-content-box { background: #f8fafc; color: #191919; padding: 20px; border-radius: 8px; margin: 15px 0; line-height: 1.6; }

        .comment-item { background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; color: white; }
        .comment-date { font-size: 0.7rem; color: var(--text-sub); text-align: right; }

        .notice-container { display: none; flex-direction: column; gap: 20px; }
        .notice-write-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .notice-editor-area { width: 100%; min-height: 150px; padding: 15px; border: 1px solid var(--border); border-radius: 6px; background: #ffffff; color: #191919; outline: none; line-height: 1.6; font-size: 0.95rem; resize: vertical; }
        .btn-notice-save { background: var(--primary); color: #0f172a; border: none; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.9rem; align-self: flex-start; }
        .btn-notice-save:hover { background: #7dd3fc; }
        .notice-feed-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .notice-feed-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
        .notice-timeline-block { padding: 8px 0; }
        .notice-timeline-content { font-size: 0.95rem; color: #f8fafc; line-height: 1.6; margin-bottom: 4px; white-space: pre-wrap; }
        .notice-timeline-footer { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 0.75rem; color: #64748b; font-style: italic; }
        .notice-delete-date-btn { background: transparent; border: none; color: #ef4444; font-size: 0.9rem; font-weight: bold; cursor: pointer; padding: 0 4px; opacity: 0.6; }
        .notice-delete-date-btn:hover { opacity: 1; }

        .dept-notice-box { background: #1e293b; border: 1px solid var(--primary); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .dept-notice-header { font-size: 0.9rem; font-weight: bold; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .dept-notice-item { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem; line-height: 1.5; color: #f8fafc; }
        .dept-notice-item:last-child { border-bottom: none; }
        .dept-notice-date { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; text-align: right; font-style: italic; }

        .tag-badge  { padding: 2px 6px; border-radius: 4px; font-weight: bold; color: white; display: inline-block; cursor: pointer; margin: 0 2px; }
        .tag-ns1  { background: #ff9800; color: white; }
        .tag-ns3  { background: #1c52ed; color: white; }
        .tag-ns5  { background: #7b1fa2; color: white; }
        .tag-os1  { background: #facc15; color: #0f172a; }
        .tag-os2  { background: #ea580c; color: white; }
        .tag-gs   { background: #00e676; color: #0f172a; }
        .tag-nr   { background: #166534; color: white; }
        .tag-fm   { background: #334155; color: white; border: 1px solid #94a3b8; }
        .tag-lab  { background: #f43f5e; color: white; }
        .tag-chk  { background: #38bdf8; color: #0f172a; }
        .tag-pt   { background: #78350f; color: white; }
        .tag-vid  { background: #000000; color: white; }
        .tag-ward { background: #ec4899; color: white; }
    </style>
</head>
<body>

<a href="index.html" class="btn-main" style="background:#64748b; display:inline-block; margin-bottom:10px; color:white;">🏠 메인</a>

<div class="blog-container">
    <!-- 상단 카테고리 필터 바 -->
    <div id="viewListHeader" class="toolbar-sticky">
        <div class="toolbar-top-row">
            <div class="cat-btn-group" id="categoryButtonGroup">
                <button class="cat-filter-btn active" onclick="filterByCategory('전체')">전체</button>
                <button class="cat-filter-btn" onclick="filterByCategory('공지')">공지</button>
                <button class="cat-filter-btn" onclick="filterByCategory('NS')">NS</button>
                <button class="cat-filter-btn" onclick="filterByCategory('OS')">OS</button>
                <button class="cat-filter-btn" onclick="filterByCategory('GS')">GS</button>
                <button class="cat-filter-btn" onclick="filterByCategory('NR')">NR</button>
                <button class="cat-filter-btn" onclick="filterByCategory('FM')">FM</button>
                <button class="cat-filter-btn" onclick="filterByCategory('병동')">병동</button>
                <button class="cat-filter-btn" onclick="filterByCategory('기타')">기타</button>
                <button class="cat-filter-btn" onclick="filterByCategory('임병')">임병</button>
                <button class="cat-filter-btn" onclick="filterByCategory('물치')">물치</button>
                <button class="cat-filter-btn" onclick="filterByCategory('영상')">영상</button>
            </div>
            <div>
                <button class="btn-main" onclick="openWriteMode(null)">글쓰기</button>
            </div>
        </div>
        <div id="subCatBar" class="sub-cat-bar"></div>
    </div>

    <!-- 1. 글 목록 화면 -->
    <div id="viewList" class="post-list"></div>

    <!-- 1-1. 공지방 타임라인 화면 -->
    <div id="viewNotice" class="notice-container">
        <div class="notice-write-section">
            <textarea id="noticeWriteContent" class="notice-editor-area" placeholder="공지 내용을 입력하세요..."></textarea>
            <button class="btn-notice-save" onclick="saveNoticePost()">공지 저장하기</button>
        </div>
        <div>
            <div class="notice-feed-title">📖 공지방</div>
            <div id="noticeFeedContainer"></div>
        </div>
    </div>

    <!-- 2. 글쓰기 / 수정 에디터 화면 -->
    <div id="viewWrite" style="display:none;">
        <div class="write-sticky-header">
            <div style="padding:8px 0; display:flex; justify-content:flex-end; gap:6px; border-bottom:1px solid var(--border); margin-bottom:8px;">
                <button class="btn-main" style="background:#475569; color:white;" onclick="switchBlogTab('list')">취소</button>
                <button class="btn-main" onclick="savePostData()">저장</button>
            </div>

            <div style="display:flex; gap:8px;">
                <select id="writeCategory" style="padding:6px; border:1px solid var(--border); border-radius:4px; background:#1e293b; color:white;">
                    <option value="NS1">NS1</option><option value="NS3">NS3</option><option value="NS5">NS5</option>
                    <option value="OS1">OS1</option><option value="OS2">OS2</option>
                    <option value="GS">GS</option><option value="NR">NR</option><option value="FM">FM</option>
                    <option value="D">D</option><option value="E">E</option><option value="N">N</option>
                    <option value="기타">기타</option><option value="임병">임병</option><option value="물치">물치</option><option value="영상">영상</option>
                </select>
                <input type="text" id="writeTitle" placeholder="제목을 입력하세요" style="flex:1; padding:6px 10px; border:1px solid var(--border); border-radius:4px; outline:none; background:#1e293b; color:white;">
            </div>
            
            <div class="editor-toolbar">
                <button type="button" class="tool-btn" onclick="applyFormat('bold')"><b>B</b></button>
                <button type="button" class="tool-btn" onclick="applyFormat('underline')"><u>U</u></button>
                
                <span>크기:</span>
                <select id="fontSizeSelect" onchange="applyCustomFontSize(this.value)" style="padding:4px; border:1px solid var(--border); border-radius:4px; background:#1e293b; color:white; font-size:0.8rem;">
                    <option value="4px">4</option>
                    <option value="6px">6</option>
                    <option value="8px">8</option>
                    <option value="10px">10</option>
                    <option value="12px">12</option>
                    <option value="14px">14</option>
                    <option value="16px" selected>16 (기본)</option>
                    <option value="18px">18</option>
                    <option value="20px">20</option>
                </select>

                <!-- 글자색 인라인 버튼 (onmousedown으로 selection 보존) -->
                <span style="font-size:0.75rem;color:var(--text-sub);">A색:</span>
                <button type="button" class="color-dot-btn" style="background:#191919;" onmousedown="saveSelection();event.preventDefault();applyTextColor('#191919')" title="검정"></button>
                <button type="button" class="color-dot-btn" style="background:#ef4444;" onmousedown="saveSelection();event.preventDefault();applyTextColor('#ef4444')" title="빨강"></button>
                <button type="button" class="color-dot-btn" style="background:#f97316;" onmousedown="saveSelection();event.preventDefault();applyTextColor('#f97316')" title="주황"></button>
                <button type="button" class="color-dot-btn" style="background:#eab308;" onmousedown="saveSelection();event.preventDefault();applyTextColor('#eab308')" title="노랑"></button>
                <button type="button" class="color-dot-btn" style="background:#22c55e;" onmousedown="saveSelection();event.preventDefault();applyTextColor('#22c55e')" title="초록"></button>
                <button type="button" class="color-dot-btn" style="background:#3b82f6;" onmousedown="saveSelection();event.preventDefault();applyTextColor('#3b82f6')" title="파랑"></button>
                <button type="button" class="color-dot-btn" style="background:#a855f7;" onmousedown="saveSelection();event.preventDefault();applyTextColor('#a855f7')" title="보라"></button>
                <button type="button" class="color-dot-btn" style="background:#ec4899;" onmousedown="saveSelection();event.preventDefault();applyTextColor('#ec4899')" title="분홍"></button>

                <!-- 형광펜 인라인 버튼 -->
                <span style="font-size:0.75rem;color:var(--text-sub);">🖍:</span>
                <button type="button" class="color-dot-btn" style="background:#fef08a;" onmousedown="saveSelection();event.preventDefault();applyHiliteColor('#fef08a')" title="노랑 형광"></button>
                <button type="button" class="color-dot-btn" style="background:#bbf7d0;" onmousedown="saveSelection();event.preventDefault();applyHiliteColor('#bbf7d0')" title="초록 형광"></button>
                <button type="button" class="color-dot-btn" style="background:#bae6fd;" onmousedown="saveSelection();event.preventDefault();applyHiliteColor('#bae6fd')" title="하늘 형광"></button>
                <button type="button" class="color-dot-btn" style="background:#fbcfe8;" onmousedown="saveSelection();event.preventDefault();applyHiliteColor('#fbcfe8')" title="핑크 형광"></button>
                <button type="button" class="color-dot-btn" style="background:#fed7aa;" onmousedown="saveSelection();event.preventDefault();applyHiliteColor('#fed7aa')" title="살구 형광"></button>
                <button type="button" class="color-dot-btn" style="background:#ddd6fe;" onmousedown="saveSelection();event.preventDefault();applyHiliteColor('#ddd6fe')" title="보라 형광"></button>
                <button type="button" class="color-dot-btn" style="background:#334155;border:1px solid #94a3b8;color:#f87171;font-size:0.7rem;font-weight:bold;" onmousedown="saveSelection();event.preventDefault();removeHighlight()" title="형광펜 제거">✕</button>

                <!-- 🚨 박스 버튼 -->
                <button type="button" class="tool-btn" onclick="applyBoxColor()" style="background:#f87171; color:white;">🚨 박스</button>
                <button type="button" class="tool-btn" style="background:#a78bfa; color:#0f172a;" onclick="convertPostBadgesInEditor()" title="태그를 뱃지로 변환">🪄 뱃지</button>
            </div>
        </div>

        <div id="writeContent" class="editor-area" contenteditable="true" placeholder="내용을 입력하세요..."></div>
    </div>

    <!-- 3. 상세 보기 화면 -->
    <div id="viewDetail" style="display:none;" class="post-detail-view">
        <div id="postDetailContainer"></div>
    </div>
</div>

<script>
    let blogPosts = JSON.parse(localStorage.getItem('my_blog_posts_final_v10')) || [];
    let timelinePosts = JSON.parse(localStorage.getItem('timeline_posts_v3')) || [];
    let currentCategoryFilter = '전체';
    let currentSubFilter = '전체';
    let editingPostId = null;
    let undoStack = [];
    let savedRange = null;

    let editorColors = {
        text: '#191919',
        hilite: '#fef08a'
    };

    const editor = document.getElementById('writeContent');

    editor.addEventListener('mouseup', saveSelection);
    editor.addEventListener('keyup', saveSelection);
    editor.addEventListener('touchend', saveSelection);

    function saveSelection() {
        const sel = window.getSelection();
        if (sel.rangeCount > 0) {
            const range = sel.getRangeAt(0);
            if (editor.contains(range.commonAncestorContainer)) {
                savedRange = range.cloneRange();
            }
        }
    }

    function restoreSelection() {
        if (savedRange) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
        }
    }

    function saveUndoState() {
        const current = editor.innerHTML;
        if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== current) {
            undoStack.push(current);
        }
        if (undoStack.length > 50) undoStack.shift();
    }

    function applyFormat(command, value = null) {
        editor.focus();
        restoreSelection();
        document.execCommand(command, false, value);
        saveSelection();
        saveUndoState();
    }

    function applyCustomFontSize(sizeVal) {
        editor.focus();
        restoreSelection();
        const sel = window.getSelection();
        if (!sel.rangeCount || sel.isCollapsed) return;

        const range = sel.getRangeAt(0);
        const span = document.createElement('span');
        span.style.fontSize = sizeVal;
        span.appendChild(range.extractContents());
        range.insertNode(span);
        
        saveSelection();
        saveUndoState();
    }

    // 색상 적용 공통 함수
    // onmousedown 순서: saveSelection() → preventDefault() → 이 함수 호출
    // savedRange에 이미 선택 영역이 들어 있으므로 거기서 바로 적용
    function applyColorToRange(styleProp, colorValue) {
        if (!savedRange || savedRange.collapsed) return;

        // savedRange로 selection 복원
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
        editor.focus();

        const range = sel.getRangeAt(0);
        if (!range || range.collapsed) return;

        const span = document.createElement('span');
        span.style[styleProp] = colorValue;

        const contents = range.extractContents();

        // 기존 같은 속성 span 제거 (중첩 방지)
        contents.querySelectorAll('span[style]').forEach(sp => {
            sp.style[styleProp] = '';
            const s = (sp.getAttribute('style') || '').replace(/[\s;]/g, '');
            if (s === '') {
                const p = sp.parentNode;
                while (sp.firstChild) p.insertBefore(sp.firstChild, sp);
                p.removeChild(sp);
            }
        });

        span.appendChild(contents);
        range.insertNode(span);

        // 커서를 span 끝으로
        const after = document.createRange();
        after.setStartAfter(span);
        after.collapse(true);
        sel.removeAllRanges();
        sel.addRange(after);
        savedRange = after.cloneRange();

        saveUndoState();
    }

    function applyTextColor(colorValue) {
        applyColorToRange('color', colorValue);
    }

    function applyHiliteColor(colorValue) {
        applyColorToRange('backgroundColor', colorValue);
    }

    function removeHighlight() {
        editor.focus();
        restoreSelection();
        const sel = window.getSelection();
        if (!sel.rangeCount) return;

        const range = sel.getRangeAt(0);
        let container = range.commonAncestorContainer;
        if (container.nodeType === Node.TEXT_NODE) {
            container = container.parentNode;
        }

        const spans = container.querySelectorAll ? container.querySelectorAll('span') : [];
        spans.forEach(span => {
            if (sel.containsNode(span, true) && !span.classList.contains('tag-badge')) {
                span.style.backgroundColor = '';
                if (!span.style.color && !span.style.fontWeight && !span.style.border && !span.style.fontSize) {
                    const parent = span.parentNode;
                    while (span.firstChild) {
                        parent.insertBefore(span.firstChild, span);
                    }
                    parent.removeChild(span);
                }
            }
        });

        if (container.tagName === 'SPAN' && !container.classList.contains('tag-badge') && container !== editor) {
            container.style.backgroundColor = '';
        }

        saveSelection();
        saveUndoState();
    }

    editor.addEventListener('input', () => {
        saveSelection();
        saveUndoState();
    });

    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key.toLowerCase() === 'z') {
            const activeWriteTab = document.getElementById('viewWrite');
            if (activeWriteTab && activeWriteTab.style.display !== 'none' && undoStack.length > 1) {
                e.preventDefault();
                undoStack.pop();
                editor.innerHTML = undoStack[undoStack.length - 1];
                saveSelection();
            }
        }
    });

    function setupPasteImage(element) {
        element.addEventListener('paste', function(e) {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf("image") !== -1) {
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = document.createElement('img');
                        img.src = event.target.result;
                        img.className = 'img-preview';
                        const selection = window.getSelection();
                        if (selection.rangeCount > 0 && element.contains(selection.getRangeAt(0).commonAncestorContainer)) {
                            const range = selection.getRangeAt(0);
                            range.deleteContents();
                            range.insertNode(img);
                        } else {
                            element.appendChild(img);
                        }
                        if (element === editor) {
                            saveUndoState();
                        }
                    };
                    reader.readAsDataURL(blob);
                    e.preventDefault();
                    break;
                }
            }
        });
    }

    setupPasteImage(editor);

    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function sanitizeHTML(html) {
        const temp = document.createElement('div');
        temp.innerHTML = html;
        temp.querySelectorAll('script, iframe, object, embed').forEach(el => el.remove());
        temp.querySelectorAll('*').forEach(el => {
            [...el.attributes].forEach(attr => {
                if (attr.name.toLowerCase().startsWith('on')) el.removeAttribute(attr.name);
                if (['href', 'src'].includes(attr.name.toLowerCase()) && attr.value.trim().toLowerCase().startsWith('javascript:')) el.removeAttribute(attr.name);
            });
        });
        return temp.innerHTML;
    }

    function convertPostBadgesInEditor() {
        editor.focus();
        restoreSelection();
        const tagMap = {
            'NS1': 'tag-ns1', 'NS3': 'tag-ns3', 'NS5': 'tag-ns5',
            'OS1': 'tag-os1', 'OS2': 'tag-os2', 'GS': 'tag-gs',
            'NR': 'tag-nr', 'FM': 'tag-fm', 'D': 'tag-d', 'E': 'tag-e', 'N': 'tag-n',
            '임병': 'tag-lab', '검진': 'tag-chk', '물치': 'tag-pt', '영상': 'tag-vid'
        };

        const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null, false);
        let node;
        let textNodes = [];
        while(node = walker.nextNode()) textNodes.push(node);

        textNodes.forEach(textNode => {
            let text = textNode.nodeValue;
            let modified = false;
            Object.keys(tagMap).forEach(key => {
                const regex = new RegExp(`(^|[^\\w가-힣])#?(${key})(?![\\w가-힣])`, 'gi');
                if (regex.test(text)) modified = true;
            });

            if (modified) {
                let tempDiv = document.createElement('div');
                let html = text;
                Object.keys(tagMap).forEach(key => {
                    const regex = new RegExp(`(^|[^\\w가-힣])#?(${key})(?![\\w가-힣])`, 'gi');
                    html = html.replace(regex, `$1<span class="tag-badge tag-${key.toLowerCase()}" data-tag="$2">$2</span>`);
                });
                tempDiv.innerHTML = html;
                
                const frag = document.createDocumentFragment();
                while(tempDiv.firstChild) frag.appendChild(tempDiv.firstChild);
                textNode.parentNode.replaceChild(frag, textNode);
            }
        });

        saveUndoState();
    }

    document.addEventListener('click', (e) => {
        if(e.target.classList.contains('tag-badge')) {
            const tagText = e.target.getAttribute('data-tag') || e.target.innerText;
            e.target.replaceWith(document.createTextNode(tagText));
        }
        else if(e.target.tagName === 'SPAN' && e.target.style.backgroundColor && !e.target.classList.contains('tag-badge')) {
            const parent = e.target.parentNode;
            while (e.target.firstChild) parent.insertBefore(e.target.firstChild, e.target);
            parent.removeChild(e.target);
        }
    });

    function applyBoxColor() {
        editor.focus();
        restoreSelection();
        const sel = window.getSelection();
        if(!sel.rangeCount || sel.isCollapsed) return;
        const range = sel.getRangeAt(0);
        const span = document.createElement('span');
        span.style.backgroundColor = '#f87171';
        span.style.color = '#ffffff';
        span.style.padding = '3px 8px';
        span.style.borderRadius = '6px';
        span.style.fontWeight = 'bold';
        span.style.border = '1px solid #ef4444';
        span.style.display = 'inline-block';
        span.style.margin = '2px 0';
        span.appendChild(range.extractContents());
        range.insertNode(span);
        
        saveSelection();
        saveUndoState();
    }

    function switchBlogTab(tab) {
        document.getElementById('viewList').style.display = tab === 'list' ? 'block' : 'none';
        const noticeContainer = document.getElementById('viewNotice');
        if (noticeContainer) noticeContainer.style.display = tab === 'notice' ? 'flex' : 'none';
        document.getElementById('viewListHeader').style.display = (tab === 'list' || tab === 'notice') ? 'flex' : 'none';
        document.getElementById('viewWrite').style.display = tab === 'write' ? 'block' : 'none';
        document.getElementById('viewDetail').style.display = tab === 'detail' ? 'block' : 'none';
        
        window.scrollTo(0, 0);

        if(tab === 'list') renderPostList();
        if(tab === 'notice') renderNoticeFeed();
    }

    const subCategories = {
        'NS': ['NS1', 'NS3', 'NS5'],
        'OS': ['OS1', 'OS2'],
        '병동': ['D', 'E', 'N']
    };

    function checkKeywordMatch(text, category, subCategory) {
        if (!text) return false;
        const lowerText = text.toLowerCase();
        
        if (category === 'NS') {
            const targets = subCategory && subCategory !== '전체' ? [subCategory.toLowerCase()] : ['ns1', 'ns3', 'ns5', 'ns'];
            return targets.some(t => lowerText.includes(t));
        }
        if (category === 'OS') {
            const targets = subCategory && subCategory !== '전체' ? [subCategory.toLowerCase()] : ['os1', 'os2', 'os'];
            return targets.some(t => lowerText.includes(t));
        }
        if (category === '병동') {
            const targets = subCategory && subCategory !== '전체' ? [subCategory.toLowerCase()] : ['d', 'e', 'n', '병동'];
            return targets.some(t => {
                if (t === 'd' || t === 'e' || t === 'n') {
                    const regex = new RegExp(`(^|[^\\w가-힣])` + t + `([^\\w가-힣]|$)`, 'i');
                    return regex.test(text);
                }
                return lowerText.includes(t);
            });
        }
        if (category === 'GS') {
            return lowerText.includes('gs');
        }
        if (category === 'NR' || category === 'FM' || category === '임병' || category === '물치' || category === '영상') {
            return lowerText.includes(category.toLowerCase());
        }
        return false;
    }

    const allMainCategories = ['NS', 'OS', 'GS', 'NR', 'FM', '병동', '임병', '물치', '영상'];

    function filterByCategory(cat) {
        currentCategoryFilter = cat;
        currentSubFilter = '전체';
        
        document.querySelectorAll('.cat-filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === cat);
        });

        const subBar = document.getElementById('subCatBar');
        if (subCategories[cat]) {
            subBar.style.display = 'flex';
            let subHtml = `<button class="sub-filter-btn active" data-sub="전체" onclick="filterBySub('전체')">전체(${cat.toUpperCase()})</button>`;
            subCategories[cat].forEach(sub => {
                subHtml += `<button class="sub-filter-btn" data-sub="${sub}" onclick="filterBySub('${sub}')">${sub}</button>`;
            });
            subBar.innerHTML = subHtml;
        } else {
            subBar.style.display = 'none';
            subBar.innerHTML = '';
        }

        if (cat === '공지') {
            switchBlogTab('notice');
        } else {
            switchBlogTab('list');
        }
    }

    function filterBySub(sub) {
        currentSubFilter = sub;
        document.querySelectorAll('.sub-filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.sub === sub);
        });
        renderPostList();
    }

    function togglePin(id, event) {
        event.stopPropagation();
        const post = blogPosts.find(p => p.id === id);
        if (post) {
            post.isPinned = !post.isPinned;
            localStorage.setItem('my_blog_posts_final_v10', JSON.stringify(blogPosts));
            renderPostList();
        }
    }

    function renderPostList() {
        const container = document.getElementById('viewList');
        container.innerHTML = '';

        let matchedNotices = [];
        if (currentCategoryFilter !== '전체') {
            timelinePosts.forEach(tp => {
                const fallbackDate = tp.createdAt ? new Date(tp.createdAt).toLocaleDateString('en-US') : getTodayDateStr();
                let entries = parseContentToEntries(tp.content, tp.id, fallbackDate);
                entries.forEach(entry => {
                    if (currentCategoryFilter === '기타') {
                        const hasAnyMainKeyword = allMainCategories.some(mainCat => checkKeywordMatch(entry.content, mainCat, '전체'));
                        if (!hasAnyMainKeyword) {
                            matchedNotices.push({ content: entry.content, date: entry.date });
                        }
                    } else {
                        if (checkKeywordMatch(entry.content, currentCategoryFilter, currentSubFilter)) {
                            matchedNotices.push({ content: entry.content, date: entry.date });
                        }
                    }
                });
            });
        }

        if (currentCategoryFilter !== '전체' && matchedNotices.length > 0) {
            const noticeBox = document.createElement('div');
            noticeBox.className = 'dept-notice-box';
            
            let headerTitle = currentSubFilter !== '전체' ? currentSubFilter : currentCategoryFilter;
            let noticeHtml = `<div class="dept-notice-header">📌 [공지방 연동] ${headerTitle} </div>`;
            matchedNotices.forEach(n => {
                noticeHtml += `
                    <div class="dept-notice-item">
                        <div>${escapeHTML(n.content).replace(/\n/g, '<br>')}</div>
                        <div class="dept-notice-date">${n.date}</div>
                    </div>
                `;
            });
            noticeBox.innerHTML = noticeHtml;
            container.appendChild(noticeBox);
        }

        let filtered = blogPosts;
        if (currentCategoryFilter !== '전체') {
            if (currentCategoryFilter === '기타') {
                filtered = blogPosts.filter(p => p.category === '기타' || !allMainCategories.some(mc => p.category.toLowerCase().includes(mc.toLowerCase())));
            } else if (subCategories[currentCategoryFilter]) {
                if (currentSubFilter === '전체') {
                    filtered = blogPosts.filter(p => subCategories[currentCategoryFilter].some(sub => p.category.toLowerCase() === sub.toLowerCase()) || p.category.toLowerCase() === currentCategoryFilter.toLowerCase());
                } else {
                    filtered = blogPosts.filter(p => p.category.toLowerCase() === currentSubFilter.toLowerCase());
                }
            } else {
                filtered = blogPosts.filter(p => p.category.toLowerCase() === currentCategoryFilter.toLowerCase());
            }
        }

        filtered.sort((a, b) => {
            if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
            return new Date(b.date) - new Date(a.date);
        });

        if (filtered.length === 0 && matchedNotices.length === 0) {
            container.innerHTML += `<p style="color:var(--text-sub); text-align:center; padding:40px;">등록된 글이 없습니다.</p>`;
            return;
        }

        filtered.forEach(p => {
            const card = document.createElement('div');
            card.className = `post-card ${p.isPinned ? 'pinned' : ''}`;
            card.onclick = () => openPostDetail(p.id);

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = p.content;
            const snippetText = tempDiv.textContent || tempDiv.innerText || '';

            card.innerHTML = `
                <div class="corner-pin" onclick="togglePin('${p.id}', event)" title="${p.isPinned ? '고정 해제' : '상단 고정'}">
                    ${p.isPinned ? '📌' : '📍'}
                </div>

                <div class="post-card-header">
                    <span class="post-category">${p.category}</span>
                </div>
                <div class="post-title">${escapeHTML(p.title)}</div>
                <div class="post-snippet">${escapeHTML(snippetText)}</div>
                
                <div class="post-footer">
                    <span class="post-date">${p.date}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function getTodayDateStr() {
        const d = new Date();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const yyyy = d.getFullYear();
        return `${mm}/${dd}/${yyyy}`;
    }

    function parseContentToEntries(rawContent, postId, fallbackDate = null) {
        const regex = /(\d{4}[-./]\d{2}[-./]\d{2})|(\d{2}[-./]\d{2}[-./]\d{4})/g;
        let matches = [...rawContent.matchAll(regex)];

        if (matches.length === 0) {
            return [{
                postId: postId,
                date: fallbackDate || getTodayDateStr(),
                content: rawContent.trim()
            }];
        }

        let entries = [];
        for (let i = 0; i < matches.length; i++) {
            let currentDateMatch = matches[i];
            let rawDateStr = currentDateMatch[0];
            let dateStr = rawDateStr;

            let parts = rawDateStr.split(/[-./]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    dateStr = `${parts[1]}/${parts[2]}/${parts[0]}`;
                } else {
                    dateStr = `${parts[0]}/${parts[1]}/${parts[2]}`;
                }
            }
            
            let matchStart = currentDateMatch.index;
            let matchEnd = currentDateMatch.index + currentDateMatch[0].length;
            
            let prevEnd = (i === 0) ? 0 : (matches[i - 1].index + matches[i - 1][0].length);
            let nextStart = (i < matches.length - 1) ? matches[i + 1].index : rawContent.length;

            let textStr = "";
            let precedingText = rawContent.substring(prevEnd, matchStart).trim();
            let followingText = rawContent.substring(matchEnd, nextStart).trim();

            if (precedingText && !followingText) {
                textStr = precedingText;
            } else {
                textStr = followingText;
                if (!textStr && precedingText) textStr = precedingText;
            }

            textStr = textStr.replace(/^[\r\n]+/, '').replace(/[\r\n]+$/, '');

            if (textStr) {
                entries.push({
                    postId: postId,
                    date: dateStr,
                    content: textStr
                });
            }
        }

        if (entries.length === 0) {
            entries.push({
                postId: postId,
                date: fallbackDate || getTodayDateStr(),
                content: rawContent.trim()
            });
        }

        return entries;
    }

    function saveNoticePost() {
        const content = document.getElementById('noticeWriteContent').value.trim();
        if(!content) { alert('내용을 입력해주세요.'); return; }

        const newPostId = Date.now();
        const newPost = { id: newPostId, content: content, createdAt: new Date().toISOString() };
        timelinePosts.unshift(newPost);
        localStorage.setItem('timeline_posts_v3', JSON.stringify(timelinePosts));

        document.getElementById('noticeWriteContent').value = '';
        renderNoticeFeed();
        alert('공지가 저장되었습니다!');
    }

    function renderNoticeFeed() {
        const feedContainer = document.getElementById('noticeFeedContainer');
        if(!feedContainer) return;
        if(timelinePosts.length === 0) {
            feedContainer.innerHTML = `<p style="color:var(--text-sub); text-align:center; padding:20px;">작성된 공지가 없습니다.</p>`;
            return;
        }

        let allEntries = [];
        timelinePosts.forEach(p => {
            const fallbackDate = p.createdAt ? new Date(p.createdAt).toLocaleDateString('en-US') : getTodayDateStr();
            let entries = parseContentToEntries(p.content, p.id, fallbackDate);
            allEntries.push(...entries);
        });

        allEntries.sort((a, b) => new Date(b.date) - new Date(a.date));

        feedContainer.innerHTML = allEntries.map(entry => `
            <div class="notice-feed-item">
                <div class="notice-timeline-block">
                    <div class="notice-timeline-content">${escapeHTML(entry.content).replace(/\n/g, '<br>')}</div>
                    <div class="notice-timeline-footer">
                        <span>${entry.date}</span>
                        <button class="notice-delete-date-btn" onclick="removeNoticePost(${entry.postId})" title="전체 삭제">×</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function removeNoticePost(id) {
        timelinePosts = timelinePosts.filter(p => p.id !== id);
        localStorage.setItem('timeline_posts_v3', JSON.stringify(timelinePosts));
        renderNoticeFeed();
    }

    function openWriteMode(id) {
        editingPostId = id;
        if (id) {
            const post = blogPosts.find(p => p.id === id);
            if (post) {
                document.getElementById('writeTitle').value = post.title || '';
                document.getElementById('writeCategory').value = post.category || '기타';
                editor.innerHTML = post.content || '';
            }
        } else {
            document.getElementById('writeTitle').value = '';
            editor.innerHTML = '';
            if (currentCategoryFilter !== '전체' && currentCategoryFilter !== '공지') {
                document.getElementById('writeCategory').value = currentSubFilter !== '전체' ? currentSubFilter : currentCategoryFilter;
            }
        }
        undoStack = [editor.innerHTML];
        switchBlogTab('write');
    }

    function savePostData() {
        const title = document.getElementById('writeTitle').value.trim();
        const category = document.getElementById('writeCategory').value;
        const content = editor.innerHTML.trim();

        if (!title || !content) {
            alert('제목과 내용을 모두 입력해주세요.');
            return;
        }

        const d = new Date();
        const todayFormatted = `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}/${d.getFullYear()}`;

        if (editingPostId) {
            const post = blogPosts.find(p => p.id === editingPostId);
            if (post) { post.title = title; post.category = category; post.content = content; }
        } else {
            blogPosts.unshift({ id: 'post_'+Date.now(), category, title, content, date: todayFormatted, comments: [], isPinned: false });
        }
        localStorage.setItem('my_blog_posts_final_v10', JSON.stringify(blogPosts));
        editingPostId = null;
        switchBlogTab('list');
    }

    function openPostDetail(id) {
        const p = blogPosts.find(p => p.id === id);
        if(!p) return;
        
        const comments = p.comments || [];

        document.getElementById('postDetailContainer').innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                <button class="btn-main" style="background:#475569; color:white;" onclick="switchBlogTab('list')">목록</button>
                <div style="display:flex; gap:6px;">
                    <button class="btn-main" style="background:#0284c7; color:#0f172a;" onclick="openWriteMode('${p.id}')">수정</button>
                    <button class="btn-main" style="background:#f87171; color:#0f172a;" onclick="deletePost('${p.id}')">삭제</button>
                </div>
            </div>

            <h2 style="color:white; margin-bottom:4px;">${escapeHTML(p.title)}</h2>
            <small style="color:var(--text-sub);">카테고리: ${p.category} | 작성일: ${p.date}</small>
            
            <div class="detail-content-box">${p.content}</div>
            
            <hr style="margin:15px 0; border:0; border-top:1px solid var(--border);">
            <h4 style="color:white;">댓글 (${comments.length})</h4>
            <div style="margin:10px 0;" id="commentListContainer">
                ${comments.length === 0 ? '<p style="font-size:0.8rem; color:#888;">댓글이 없습니다.</p>' : ''}
                ${comments.map((c, index) => `
                    <div class="comment-item" id="comment-${p.id}-${index}">
                        <div id="comment-text-${p.id}-${index}">${sanitizeHTML(c.text)}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                            <span class="comment-date">🕒 ${c.date}</span>
                            <div style="display:flex; gap:4px;">
                                <button class="btn-main" style="padding:2px 6px; font-size:0.65rem; background:#0284c7; color:#0f172a;" onclick="editComment('${p.id}', ${index})">수정</button>
                                <button class="btn-main" style="padding:2px 6px; font-size:0.65rem; background:#f87171; color:#0f172a;" onclick="deleteComment('${p.id}', ${index})">삭제</button>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
            
            <div style="display:flex; flex-direction:column; gap:6px; border:1px solid var(--border); padding:8px; border-radius:6px; background:#1e293b; margin-top:15px;">
                <div id="commentInputDiv" class="editor-area" style="min-height:45px; padding:6px; background:#f8fafc; color:#191919;" contenteditable="true" placeholder="댓글 입력 또는 사진 Ctrl+V..."></div>
                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:4px;">
                    <span style="font-size:0.7rem; color:#94a3b8;">💡 댓글 사진 Ctrl+V 가능</span>
                    <button class="btn-main" style="padding:4px 10px; font-size:0.75rem;" onclick="addComment('${p.id}')">댓글등록</button>
                </div>
            </div>
        `;
        setupPasteImage(document.getElementById('commentInputDiv'));
        switchBlogTab('detail');
    }

    function addComment(id) {
        const div = document.getElementById('commentInputDiv');
        const text = div.innerHTML.trim();
        if(!text) return;
        const post = blogPosts.find(p => p.id === id);
        if (!post.comments) post.comments = [];
        post.comments.push({ date: new Date().toLocaleString(), text });
        localStorage.setItem('my_blog_posts_final_v10', JSON.stringify(blogPosts));
        openPostDetail(id);
    }

    function editComment(postId, commentIndex) {
        const textDiv = document.getElementById(`comment-text-${postId}-${commentIndex}`);
        const currentContent = textDiv.innerHTML;
        
        textDiv.innerHTML = `
            <div contenteditable="true" id="editCommentBox-${postId}-${commentIndex}" style="background:#f8fafc; color:#191919; padding:6px; border-radius:4px; min-height:35px; outline:none;">${currentContent}</div>
            <div style="display:flex; justify-content:flex-end; gap:4px; margin-top:4px;">
                <button class="btn-main" style="padding:2px 8px; font-size:0.65rem; background:#475569; color:white;" onclick="openPostDetail('${postId}')">취소</button>
                <button class="btn-main" style="padding:2px 8px; font-size:0.65rem; background:#38bdf8; color:#0f172a;" onclick="saveEditedComment('${postId}', ${commentIndex})">저장</button>
            </div>
        `;
        setupPasteImage(document.getElementById(`editCommentBox-${postId}-${commentIndex}`));
    }

    function saveEditedComment(postId, commentIndex) {
        const editBox = document.getElementById(`editCommentBox-${postId}-${commentIndex}`);
        const newText = editBox.innerHTML.trim();
        if(!newText) return;

        const post = blogPosts.find(p => p.id === postId);
        if(post && post.comments && post.comments[commentIndex]) {
            post.comments[commentIndex].text = newText;
            localStorage.setItem('my_blog_posts_final_v10', JSON.stringify(blogPosts));
            openPostDetail(postId);
        }
    }

    function deleteComment(postId, commentIndex) {
        if(confirm("댓글을 삭제하시겠습니까?")) {
            const post = blogPosts.find(p => p.id === postId);
            if(post && post.comments) {
                post.comments.splice(commentIndex, 1);
                localStorage.setItem('my_blog_posts_final_v10', JSON.stringify(blogPosts));
                openPostDetail(postId);
            }
        }
    }

    function deletePost(id) {
        if(confirm("정말 삭제하시겠습니까?")) {
            blogPosts = blogPosts.filter(p => p.id !== id);
            localStorage.setItem('my_blog_posts_final_v10', JSON.stringify(blogPosts));
            switchBlogTab('list');
        }
    }

    renderPostList();
</script>
