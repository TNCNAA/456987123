<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 업무 ✨</title>
    <link href="https://hangeul.pstatic.net/hangeul_font/css/nanum-square-round.css" rel="stylesheet">
    
    <!-- 🟢 Firebase SDK 불러오기 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHe6Ibe8WBzceMnWJxmQrKJQw10Jmmkmg",
            authDomain: "tncnaaa.firebaseapp.com",
            databaseURL: "https://tncnaaa-default-rtdb.firebaseio.com",
            projectId: "tncnaaa",
            storageBucket: "tncnaaa.firebasestorage.app",
            messagingSenderId: "822557545187",
            appId: "1:822557545187:web:e18ac197649be1164b6bd6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 페이지 로드 시 초기 비밀번호 확인 및 생성
        window.addEventListener('DOMContentLoaded', async () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
            }

            try {
                const pwRef = doc(db, "settings", "portal");
                const docSnap = await getDoc(pwRef);
                if (!docSnap.exists()) {
                    await setDoc(pwRef, { password: "1234" });
                }
            } catch (error) {
                console.error("Firebase 초기화 에러:", error);
            }
        });

        window.checkEnter = function(e) {
            if (e.key === 'Enter') window.tryLogin();
        };

        // 로그인 시도 (Firebase에서 최신 비밀번호 조회)
        window.tryLogin = async function() {
            const inputVal = document.getElementById('pwInput').value;
            const errorMsg = document.getElementById('loginError');

            try {
                const pwRef = doc(db, "settings", "portal");
                const docSnap = await getDoc(pwRef);
                const savedPw = docSnap.exists() ? docSnap.data().password : "1234";

                if (inputVal === savedPw) {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    document.getElementById('loginOverlay').style.display = 'none';
                } else {
                    errorMsg.style.display = 'block';
                    document.getElementById('pwInput').value = '';
                }
            } catch (error) {
                alert("로그인 중 오류가 발생했어요! 🥲");
                console.error(error);
            }
        };

        // 비밀번호 변경 (Firebase 데이터 업데이트)
        window.changePassword = async function() {
            try {
                const pwRef = doc(db, "settings", "portal");
                const docSnap = await getDoc(pwRef);
                const savedPw = docSnap.exists() ? docSnap.data().password : "1234";

                const currentPw = prompt("기존 비밀번호🔑");

                if (currentPw === savedPw) {
                    const newPw = prompt("새로운 비밀번호✨");
                    if (newPw && newPw.trim() !== "") {
                        await updateDoc(pwRef, { password: newPw.trim() });
                        alert("비밀번호 변경완료");
                    } else {
                        alert("비밀번호 변경취소");
                    }
                } else if (currentPw !== null) {
                    alert("기존 비밀번호가 올바르지 않아요! 🥲");
                }
            } catch (error) {
                alert("비밀번호 변경 중 오류가 발생했어요! 🥲");
                console.error(error);
            }
        };
    </script>

    <style>
        :root {
            --bg-color: #fff9f5;
            --card-bg: #ffffff;
            --primary-color: #221430;
            --secondary-color: #ffdac1;
            --text-color: #555555;
            --title-color: #ff9aa2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'NanumSquareRound', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; 
            min-height: 100vh; 
            display: flex;         
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }

        /* 🔒 로그인 잠금 화면 */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 249, 245, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 183, 178, 0.25);
            border: 3px solid var(--secondary-color);
        }

        .login-box h3 { color: var(--title-color); margin-bottom: 10px; font-size: 1.5rem; }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.1rem;
            font-family: 'NanumSquareRound', sans-serif;
            border: 2px solid #eee;
            border-radius: 15px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .login-box button {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            font-family: 'NanumSquareRound', sans-serif;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 183, 178, 0.4);
        }
        .login-error { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; display: none; font-weight: bold; }

        /* 메인 포털 화면 */
        .menu-box { 
            background: var(--card-bg); 
            width: 100%;             
            max-width: 450px;        
            padding: 35px 30px; 
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            text-align: center;      
            border: 3px solid var(--secondary-color);
        }

        h1 { color: var(--title-color); margin-bottom: 25px; font-size: 1.6rem; }
        
        .nav-btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-size: 1.05rem; 
            font-family: 'NanumSquareRound', sans-serif;
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            box-sizing: border-box; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.1s, opacity 0.2s;
        }
        .nav-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .settings-area { margin-top: 25px; border-top: 2px dashed #eee; padding-top: 15px; text-align: center; }
        .pwd-change-btn { background: none; border: none; color: #888; font-family: 'NanumSquareRound', sans-serif; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- 🔒 잠금 화면 -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3>🧸🧸🧸🧸</h3>
            <input type="password" id="pwInput" placeholder="" onkeypress="checkEnter(event)">
            <button onclick="tryLogin()">PASS</button>
            <div id="loginError" class="login-error">앗, 비밀번호가 틀렸어요! 🥺</div>
        </div>
    </div>

    <!-- 메인 포털 화면 -->
    <div class="menu-box">
                
        <!-- 각 기능별 파일 링크 버튼들 -->
        <a href="manual.html" class="nav-btn" style="background: #ffdac1; color: #333;">메뉴얼</a>
        <a href="nurse.html" class="nav-btn" style="background: #b5ead7; color: #333;">혈액검사</a>
        <a href="photo.html" class="nav-btn" style="background: #b5ead7; color: #333;">사진</a>
        <a href="iv_calc.html" class="nav-btn" style="background: #c7ceea; color: #333;">계산기</a>
        <a href="blog.html" class="nav-btn" style="background: #b5ead7; color: #333;">Blog</a>
        <a href="memo.html" class="nav-btn" style="background: #b5ead7; color: #333;">메모</a>

        <!-- 비밀번호 변경 버튼 -->
        <div class="settings-area">
            <button class="pwd-change-btn" onclick="changePassword()">비밀번호 변경 🔒</button>
        </div>
    </div>

</body>
</html>
